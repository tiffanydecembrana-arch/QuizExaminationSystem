
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Learning Material</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            padding: 25px;
            background: #EAF7EF;
            color: #334155;
        }

        .container {
            max-width: 950px;
            margin: 25px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        h1, h2, h3 {
            color: #0B5D35;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button {
            background: #e2e8f0;
            color: #334155;
        }

        .notice {
            padding: 15px;
            margin-bottom: 20px;
            border-left: 5px solid #16834A;
            background: #F0FDF4;
            border-radius: 8px;
            line-height: 1.5;
        }

        .material-info {
            padding: 20px;
            background: #F0FDF4;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .material-info p {
            line-height: 1.6;
        }

        .item-card {
            padding: 22px;
            margin: 18px 0;
            border: 1px solid #dbe7df;
            border-radius: 12px;
        }

        .item-number {
            color: #16834A;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .question {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .choice {
            padding: 12px;
            margin: 9px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            line-height: 1.5;
        }

        .flashcard-term {
            font-size: 19px;
            font-weight: bold;
            color: #0B5D35;
            margin-bottom: 15px;
        }

        .flashcard-answer {
            padding: 15px;
            background: #F0FDF4;
            border-radius: 8px;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .error {
            padding: 15px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 8px;
            line-height: 1.5;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 18px;
                margin: 10px auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Learning Material</h1>
        <button class="back-button" onclick="goBack()">
            Back to Dashboard
        </button>
    </div>

    <div id="loadingSection" class="loading">
        Loading learning material...
    </div>

    <div id="errorSection" hidden>
        <div class="error" id="errorMessage"></div>
        <br>
        <button class="back-button" onclick="goBack()">
            Back to Dashboard
        </button>
    </div>

    <div id="mainContent" hidden>

        <div class="notice">
            <strong>Teacher View Only</strong><br>
            You are viewing this published learning material as a teacher.
            This page is for reviewing questions, choices, and answers.
            Answering and submitting assessments are not available here.
        </div>

        <div class="material-info">
            <h2 id="materialTitle"></h2>

            <p id="materialDescription"></p>

            <p>
                <strong>Material Type:</strong>
                <span id="materialType"></span>
            </p>

            <p>
                <strong>Total Items:</strong>
                <span id="materialCount"></span>
            </p>
        </div>

        <div id="itemsContainer"></div>

    </div>

</div>

<script>
    // ==========================================
    // GLOBAL VARIABLES
    // ==========================================

    const params = new URLSearchParams(window.location.search);

    const materialId = Number(
        params.get('id') || params.get('materialId')
    );

    let currentUser = null;
    let material = null;
    let questions = [];

    // ==========================================
    // HELPER FUNCTIONS
    // ==========================================

    function goBack() {
        window.location.href = 'dashboard.html';
    }

    function showError(message) {
        document.getElementById('loadingSection').hidden = true;
        document.getElementById('mainContent').hidden = true;
        document.getElementById('errorSection').hidden = false;

        document.getElementById('errorMessage').textContent = message;
    }

    async function apiRequest(url) {
        const response = await fetch(url, {
            method: 'GET',
            credentials: 'same-origin'
        });

        let data = {};

        try {
            data = await response.json();
        } catch {
            data = {};
        }

        if (!response.ok) {
            const error = new Error(
                data.message || 'Unable to load learning material.'
            );

            error.status = response.status;

            throw error;
        }

        return data;
    }

    // ==========================================
    // TEACHER ACCESS CHECK
    // ==========================================

    async function verifyTeacherAccess() {
        try {
            const user = await apiRequest('/api/student');

            currentUser = user;

            if (user.role === 'student') {
                window.location.href = 'dashboard.html';
                return false;
            }

            if (user.role !== 'teacher') {
                showError('Teacher accounts only can access this page.');
                return false;
            }

            return true;

        } catch (error) {
            if (error.status === 401) {
                window.location.href = 'login.html';
                return false;
            }

            showError(
                error.message || 'Unable to verify your account.'
            );

            return false;
        }
    }

    // ==========================================
    // LOAD MATERIAL
    // ==========================================

    async function loadMaterial() {
        if (!Number.isInteger(materialId) || materialId < 1) {
            showError('Invalid learning material ID.');
            return;
        }

        try {
            const data = await apiRequest(
                `/api/materials/${materialId}/teacher-view`
            );

            material = data.material;

            if (!material) {
                showError('Published learning material not found.');
                return;
            }

            questions = Array.isArray(material.questions)
                ? material.questions
                : [];

            displayMaterial();

        } catch (error) {
            showError(
                error.message || 'Unable to load learning material.'
            );
        }
    }

    // ==========================================
    // DISPLAY MATERIAL
    // ==========================================

    function displayMaterial() {
        document.getElementById('loadingSection').hidden = true;
        document.getElementById('mainContent').hidden = false;

        document.getElementById('materialTitle').textContent =
            material.title || 'Learning Material';

        document.getElementById('materialDescription').textContent =
            material.description || 'No description provided.';

        const type = String(material.material_type || '').toLowerCase();

        document.getElementById('materialType').textContent =
            type === 'quiz' ? 'Online Quiz' :
            type === 'exam' ? 'Online Examination' :
            'Flashcard Review';

        document.getElementById('materialCount').textContent =
            questions.length;

        if (type === 'flashcard') {
            displayFlashcards();
        } else if (type === 'quiz' || type === 'exam') {
            displayAssessmentQuestions();
        } else {
            showError('Invalid learning material type.');
        }
    }

    // ==========================================
    // DISPLAY QUIZ / EXAM QUESTIONS
    // ==========================================

    function displayAssessmentQuestions() {
        const container = document.getElementById('itemsContainer');

        container.innerHTML = '';

        if (questions.length === 0) {
            container.innerHTML =
                '<div class="empty">No questions available.</div>';
            return;
        }

        questions.forEach((question, index) => {
            const card = document.createElement('div');

            card.className = 'item-card';

            const number = document.createElement('div');

            number.className = 'item-number';
            number.textContent = `Question ${index + 1}`;

            const questionText = document.createElement('div');

            questionText.className = 'question';
            questionText.textContent = question.question || '';

            card.appendChild(number);
            card.appendChild(questionText);

            const options = Array.isArray(question.options)
                ? question.options
                : [];

            options.forEach((option, optionIndex) => {
                const choice = document.createElement('div');

                choice.className = 'choice';

                choice.textContent =
                    `${String.fromCharCode(65 + optionIndex)}. ${option}`;

                card.appendChild(choice);
            });

            container.appendChild(card);
        });
    }

    // ==========================================
    // DISPLAY FLASHCARDS
    // ==========================================

    function displayFlashcards() {
        const container = document.getElementById('itemsContainer');

        container.innerHTML = '';

        if (questions.length === 0) {
            container.innerHTML =
                '<div class="empty">No flashcards available.</div>';
            return;
        }

        questions.forEach((card, index) => {
            const item = document.createElement('div');

            item.className = 'item-card';

            const number = document.createElement('div');

            number.className = 'item-number';
            number.textContent = `Flashcard ${index + 1}`;

            const term = document.createElement('div');

            term.className = 'flashcard-term';
            term.textContent = card.term || '';

            const answer = document.createElement('div');

            answer.className = 'flashcard-answer';
            answer.textContent = card.answer || '';

            item.appendChild(number);
            item.appendChild(term);
            item.appendChild(answer);

            container.appendChild(item);
        });
    }

    // ==========================================
    // INITIALIZE PAGE
    // ==========================================

    async function initializePage() {
        const allowed = await verifyTeacherAccess();

        if (!allowed) return;

        await loadMaterial();
    }

    initializePage();
</script>

</body>
</html>
